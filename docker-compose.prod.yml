# codingpt.ghmate.com        → codingpt_front_prod:3400  (Next.js 공개 랜딩/결제/약관/웹코딩 — 정식 도메인)
# codingpt-front.ghmate.com  → codingpt_front_prod:3400  (별칭, 유지)
# codingpt-back.ghmate.com   → codingpt_back_prod:5100
# (어드민은 독립 프로젝트로 분리됨 → ../codingpt_admin = codingpt-admin.ghmate.com)
# dev/stg 구조 미러 — DB는 홈서버 Docker PostgreSQL (AWS 미사용)

services:
  postgres:
    container_name: codingpt_postgres_prod
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: codingpt_db
      POSTGRES_USER: codingpt
      POSTGRES_PASSWORD: codingpt123
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - codingpt_prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codingpt -d codingpt_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  back:
    container_name: codingpt_back_prod
    build:
      context: ./codingpt_back
      dockerfile: Dockerfile
    expose:
      - "5100"
    environment:
      - NODE_ENV=production
      - CODE_EXECUTOR_URL=http://code-executor:5200
      - AGENT_WORKER_URL=http://agent-worker:5400
      - DB_HOST=postgres
      - DB_SSL=false
    env_file:
      - ./codingpt_back/.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - codingpt_prod
      - nginx_proxy
    restart: unless-stopped

  # 공개 사이트(Next.js SSR) — 랜딩 + 구독/크레딧 결제 + 약관/사업자정보
  front:
    container_name: codingpt_front_prod
    build:
      context: ./codingpt_front
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: https://codingpt-back.ghmate.com
        NEXT_PUBLIC_PORTONE_STORE_ID: ${PORTONE_STORE_ID:-}
        NEXT_PUBLIC_PORTONE_CHANNEL_KEY_CHARGE: ${PORTONE_CHANNEL_KEY_CHARGE:-}
        NEXT_PUBLIC_PORTONE_CHANNEL_KEY_BILLING: ${PORTONE_CHANNEL_KEY_BILLING:-}
        NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-297240989832-g5uoolfsp5pf8la94cq0ra4sr06sa5pj.apps.googleusercontent.com}
    environment:
      - NODE_ENV=production
      - BACKEND_INTERNAL_URL=http://back:5100
    expose:
      - "3400"
    networks:
      - codingpt_prod
      - nginx_proxy
    restart: unless-stopped

  # 어드민(Vite)은 독립 프로젝트로 분리됨 → ../codingpt_admin (자체 docker-compose)

  code-executor:
    container_name: codingpt_code_executor_prod
    build:
      context: ./codingpt_back
      dockerfile: Dockerfile
    command: node executor-server.js
    expose:
      - "5200"
    environment:
      - NODE_ENV=production
      - SKIP_MIGRATIONS=1
    env_file:
      - ./codingpt_back/.env
    networks:
      - codingpt_prod
    restart: unless-stopped

  # 샌드박스/프리뷰 워커 — 사용자 dev 서버·멀티 터미널·PTY 를 격리 컨테이너(docker.sock)에서 구동.
  # (과거 클라우드 AI query() 실행부는 BYO 피벗으로 제거됨. 남은 preview/sandbox 인프라는 M5 재사용.)
  # 내부 전용(nginx_proxy 미연결). replica=1 유지. 이미지 이름 명시(샌드박스가 재사용).
  # 주의: docker.sock 마운트 = 호스트 루트 동등 권한.
  agent-worker:
    container_name: codingpt_agent_worker_prod
    build:
      context: ./codingpt_back
      dockerfile: Dockerfile
    image: codingpt-agent-worker:prod
    command: node agent-worker.js
    expose:
      - "5400"
    environment:
      - NODE_ENV=production
      - SKIP_MIGRATIONS=1
      - AGENT_WORKER_PORT=5400
      - AGENT_WORKSPACE_ROOT=/workspace
      - AGENT_SANDBOX_ENABLED=1
      - AGENT_SANDBOX_IMAGE=codingpt-agent-worker:prod
      - AGENT_SANDBOX_MEM_MB=2048   # dev 서버(vite) 메모리 여유(512MB OOM 방지)
      - AGENT_SANDBOX_VOLUME=cpt_agent_workspace_prod
      # 샌드박스는 internal 네트워크(직접 인터넷 차단) + allowlist 프록시로만 egress
      - AGENT_SANDBOX_NETWORK=cpt_sandbox_net_prod
      - AGENT_EGRESS_PROXY=http://egress-proxy:3128
    env_file:
      - ./codingpt_back/.env
    volumes:
      - cpt_agent_workspace:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - codingpt_prod
      - cpt_sandbox_net       # 미리보기 dev 서버 프록시: 샌드박스에 직접 HTTP 도달
    restart: unless-stopped

  # 샌드박스 egress allowlist 프록시 — internal 네트워크 샌드박스가 이걸 통해서만 인터넷.
  egress-proxy:
    container_name: codingpt_egress_proxy_prod
    image: ubuntu/squid:latest
    volumes:
      - ./egress-proxy/squid.conf:/etc/squid/squid.conf:ro
    networks:
      - codingpt_prod     # 인터넷 egress
      - cpt_sandbox_net     # 샌드박스(internal)와 통신
    restart: unless-stopped

networks:
  codingpt_prod:
    driver: bridge
  nginx_proxy:
    external: true
  cpt_sandbox_net:
    name: cpt_sandbox_net_prod
    internal: true

volumes:
  postgres_prod_data:
  cpt_agent_workspace:
    name: cpt_agent_workspace_prod
