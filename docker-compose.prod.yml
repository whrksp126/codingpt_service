# codingpt.ghmate.com        → codingpt_front_prod:3400  (Next.js 공개 랜딩/결제/약관/웹코딩 — 정식 도메인)
# codingpt-front.ghmate.com  → codingpt_front_prod:3400  (별칭, 유지)
# codingpt-back.ghmate.com   → codingpt_back_prod:5100
# (어드민은 독립 프로젝트로 분리됨 → ../codingpt_admin = codingpt-admin.ghmate.com)
# dev/stg 구조 미러 — DB는 홈서버 Docker PostgreSQL (AWS 미사용)

services:
  postgres:
    container_name: codingpt_postgres_prod
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: codingpt_db
      POSTGRES_USER: codingpt
      # 비번은 git 에 하드코딩하지 않는다 — 최초 init 시에만 사용되며(볼륨 초기화됨→이후 무시),
      # 실제 접속 비번은 DB(pg_authid) + back 의 env_file(DB_PASSWORD)이 정본. compose .env 의 DB_PASSWORD 로 주입.
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - codingpt_prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codingpt -d codingpt_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  back:
    container_name: codingpt_back_prod
    build:
      context: ./codingpt_back
      dockerfile: Dockerfile
    expose:
      - "5100"
    environment:
      - NODE_ENV=production
      - CODE_EXECUTOR_URL=http://code-executor:5200
      - AGENT_WORKER_URL=http://agent-worker:5400
      - DB_HOST=postgres
      - DB_SSL=false
      # 클라우드 러너(M5) — 데모/심사 계정이 서버에서 24/7(scale-to-zero) 워크스페이스를 쓰도록 활성.
      - CLOUD_RUNNER_ENABLED=true
      - CLOUD_RUNNER_IMAGE=codingpt-runner:dev
      - CLOUD_RUNNER_SERVER_URL=http://back:5100   # 러너 컨테이너가 붙을 back 주소(prod 내부 포트 5100)
      - CLOUD_RUNNER_NETWORK=codingpt_prod_codingpt_prod
      # Docker 접근은 raw 소켓 직결 대신 socket-proxy 경유 — back(공개 API)이 호스트 소켓을 직접 안 만짐.
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
      # 클라우드 실행시간 쿼터 강제 OFF. 앱은 BYO 피벗으로 구독 UI 킬스위치(SUBSCRIPTION_ENABLED=false)라
      #  한도를 늘려 살 경로가 어디에도 없다 — 강제만 켜두면 한도 초과 계정은 402 로 영구히 막힌다.
      #  심사 데모 계정이 실제로 그 상태였고(주간 7200s 한도에 458,000s 사용) 로그인 직후 첫 호출인
      #  POST /api/daemon/runner/cloud/ensure 가 402 를 돌려줬다. 앱이 오류를 삼켜 화면엔 아무 표시도 없다.
      #  실행시간 과금을 되살릴 땐 데모 계정 예외/한도부터 준 뒤 이 줄을 지운다.
      #  compose `environment` 가 env_file 보다 우선하므로 .env 의 값과 무관하게 여기가 정본이다.
      - BILLING_ENFORCE=false
      # 인앱 "업데이트 확인"(GET /api/app/version)이 비교할 스토어 게시 버전.
      #  ⚠ 이 값은 손으로 고치면 반드시 썩는다 — 실제로 앱이 0.2.9 인데 여기가 0.2.5 라
      #   업데이트 확인이 영구히 "최신 버전입니다" 를 돌려주고 있었다(안내 도달 0).
      #  그래서 iOS 는 back 이 App Store 공개 lookup 으로 **자동 감지**한다(services/appReleaseService.js).
      #   → APP_LATEST_IOS 는 조회 실패 시의 폴백일 뿐이라 낡아도 안전하다.
      #  Android 는 공식 조회 경로가 없어(Play Developer API = 서비스계정 필요) 여기가 정본이다.
      #   → **Play 게시가 끝나면 APP_LATEST_ANDROID 를 반드시 같이 올릴 것.**
      #  APP_MIN_IOS/APP_MIN_ANDROID 는 강제 업데이트 킬스위치(평소 비워 둠).
      - APP_LATEST_IOS=0.2.5
      - APP_LATEST_ANDROID=0.2.5
    env_file:
      - ./codingpt_back/.env
    depends_on:
      postgres:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
    networks:
      - codingpt_prod
      - nginx_proxy
    restart: unless-stopped

  # Docker 소켓 프록시 — back 이 컨테이너 생성/시작/정지만 할 수 있도록 API 표면을 제한(raw 소켓 직결 방지).
  #  cloudRunnerService(dockerode)가 DOCKER_HOST=tcp://docker-socket-proxy:2375 로 접근한다.
  docker-socket-proxy:
    container_name: codingpt_docker_proxy_prod
    image: tecnativa/docker-socket-proxy:latest
    environment:
      - CONTAINERS=1   # /containers/* (create/inspect/list)
      - IMAGES=1       # 이미지 inspect(컨테이너 생성 시 필요)
      - VOLUMES=1      # named volume(코드/크레덴셜/세션 영속)
      - NETWORKS=1     # 러너를 codingpt_prod 네트워크에 연결
      - POST=1         # 생성/시작/정지/삭제(쓰기) 허용
      - EXEC=0         # exec 비허용
      - INFO=0
      - SWARM=0
      - SYSTEM=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - codingpt_prod
    restart: unless-stopped

  # 공개 사이트(Next.js SSR) — 랜딩 + 구독/크레딧 결제 + 약관/사업자정보
  front:
    container_name: codingpt_front_prod
    build:
      context: ./codingpt_front
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: https://codingpt-back.ghmate.com
        NEXT_PUBLIC_PORTONE_STORE_ID: ${PORTONE_STORE_ID:-}
        NEXT_PUBLIC_PORTONE_CHANNEL_KEY_CHARGE: ${PORTONE_CHANNEL_KEY_CHARGE:-}
        NEXT_PUBLIC_PORTONE_CHANNEL_KEY_BILLING: ${PORTONE_CHANNEL_KEY_BILLING:-}
        NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-297240989832-g5uoolfsp5pf8la94cq0ra4sr06sa5pj.apps.googleusercontent.com}
    environment:
      - NODE_ENV=production
      - BACKEND_INTERNAL_URL=http://back:5100
    expose:
      - "3400"
    networks:
      - codingpt_prod
      - nginx_proxy
    restart: unless-stopped

  # 어드민(Vite)은 독립 프로젝트로 분리됨 → ../codingpt_admin (자체 docker-compose)

  code-executor:
    container_name: codingpt_code_executor_prod
    build:
      context: ./codingpt_back
      dockerfile: Dockerfile
    command: node executor-server.js
    expose:
      - "5200"
    environment:
      - NODE_ENV=production
      - SKIP_MIGRATIONS=1
    env_file:
      - ./codingpt_back/.env
    networks:
      - codingpt_prod
    restart: unless-stopped

  # 샌드박스/프리뷰 워커 — 사용자 dev 서버·멀티 터미널·PTY 를 격리 컨테이너(docker.sock)에서 구동.
  # (과거 클라우드 AI query() 실행부는 BYO 피벗으로 제거됨. 남은 preview/sandbox 인프라는 M5 재사용.)
  # 내부 전용(nginx_proxy 미연결). replica=1 유지. 이미지 이름 명시(샌드박스가 재사용).
  # 주의: docker.sock 마운트 = 호스트 루트 동등 권한.
  agent-worker:
    container_name: codingpt_agent_worker_prod
    build:
      context: ./codingpt_back
      dockerfile: Dockerfile
    image: codingpt-agent-worker:prod
    command: node agent-worker.js
    expose:
      - "5400"
    environment:
      - NODE_ENV=production
      - SKIP_MIGRATIONS=1
      - AGENT_WORKER_PORT=5400
      - AGENT_WORKSPACE_ROOT=/workspace
      - AGENT_SANDBOX_ENABLED=1
      - AGENT_SANDBOX_IMAGE=codingpt-agent-worker:prod
      - AGENT_SANDBOX_MEM_MB=2048   # dev 서버(vite) 메모리 여유(512MB OOM 방지)
      - AGENT_SANDBOX_VOLUME=cpt_agent_workspace_prod
      # 샌드박스는 internal 네트워크(직접 인터넷 차단) + allowlist 프록시로만 egress
      - AGENT_SANDBOX_NETWORK=cpt_sandbox_net_prod
      - AGENT_EGRESS_PROXY=http://egress-proxy:3128
    env_file:
      - ./codingpt_back/.env
    volumes:
      - cpt_agent_workspace:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - codingpt_prod
      - cpt_sandbox_net       # 미리보기 dev 서버 프록시: 샌드박스에 직접 HTTP 도달
    restart: unless-stopped

  # 샌드박스 egress allowlist 프록시 — internal 네트워크 샌드박스가 이걸 통해서만 인터넷.
  egress-proxy:
    container_name: codingpt_egress_proxy_prod
    image: ubuntu/squid:latest
    volumes:
      - ./egress-proxy/squid.conf:/etc/squid/squid.conf:ro
    networks:
      - codingpt_prod     # 인터넷 egress
      - cpt_sandbox_net     # 샌드박스(internal)와 통신
    restart: unless-stopped

networks:
  codingpt_prod:
    driver: bridge
  nginx_proxy:
    external: true
  cpt_sandbox_net:
    name: cpt_sandbox_net_prod
    internal: true

volumes:
  postgres_prod_data:
  cpt_agent_workspace:
    name: cpt_agent_workspace_prod
