      { cwd: 'other/project/hub', tid: 3, agent: 'claude', state: 'working', since: Date.now() - 60000, detail: '' },
    ],
    notes: [{ cwd: 'other/project/codingpt', comment: '워커 결과 모으는 중 — 결제 재시도만 남음', status: 'in-progress' }, { cwd: 'other/project/hub', comment: null, status: 'in-review' }] };
  S.state.orch.byHost['11'] = { ...window.__ORCH, at: Date.now() };
  S.state.approvals = [{ id: 'ap1', hostDeviceId: 11, cwd: '.codingpt/worktrees/r_l1', win: 5, createdAt: 1 },
    { id: 'ap2', hostDeviceId: 12, cwd: '.codingpt/worktrees/r_i1', win: 2, createdAt: 2 }];
  if (location.hash.includes('main')) document.body.classList.add('with-main');
  const TA = await import('./js/tasks-api.js');
  await TA.refreshHostCaps();
  const AA = await import('./js/automations-api.js');
  AA.noteRunnerAwake({ deviceId: 11, online: true, awake: true, busy: true });
  const AV = await import('./js/automations-view.js');
  const TV = await import('./js/tasks-view.js');
  // 이슈 장소(issues-view.js) 확인용 — `#main-issues`(목록) · `#main-issues-board` · `#main-issues-table` · `-sheet`(상세 시트).
  const iss = (n, title, status, o = {}) => ({ id: o.gh ? `gh:me/codingpt#${n}` : 'iss_' + n, number: n, key: o.gh ? `codingpt#${n}` : '#' + n, title, body: o.body || '', status,
    priority: o.pri || 'none', labels: o.labels || [], cwd: o.cwd === undefined ? 'other/project/codingpt' : o.cwd,
    source: { provider: o.gh ? 'github' : 'codingpt', url: o.gh ? `https://github.com/me/codingpt/issues/${n}` : null, repo: o.gh ? 'me/codingpt' : null },
    link: o.link || null, createdAt: Date.now() - n * 3600e3, updatedAt: Date.now() - n * 1800e3 });
  window.__ISSUES = { at: Date.now(), sources: [{ provider: 'codingpt', cwd: null, ok: true }, { provider: 'github', cwd: 'other/project/codingpt', ok: true }], issues: [
    iss(14, '음성 입력 언어 선택', 'todo', { pri: 'medium', labels: ['voice'] }), iss(13, 'README 정리', 'todo', { cwd: 'other/project/hub' }),
    iss(41, '로그인 후 리다이렉트가 /home 으로 고정됨', 'todo', { gh: true, pri: 'high', labels: ['bug'] }),
    iss(12, '결제 실패 재시도', 'in_progress', { pri: 'urgent', link: { mode: 'task', agent: 'claude', taskId: 't_pay' }, body: '결제 API 가 5xx 를 주면 세 번까지 다시 시도한다.\n\n끝났다는 기준: 재시도 테스트 3건 통과.' }),
    iss(38, '다크 모드에서 표 테두리가 안 보임', 'in_progress', { gh: true, link: { mode: 'terminal', agent: 'codex', tid: 7 } }),
    iss(10, '알림 문구 다듬기', 'in_review', { labels: ['copy'] }), iss(9, '이미지 업로드 개선', 'done', { cwd: 'other/project/hub' }), iss(30, 'CI 캐시 키 수정', 'done', { gh: true }),
    iss(15, '어느 프로젝트인지 아직 모르는 아이디어', 'todo', { cwd: '' }) ] };
  const IV = await import('./js/issues-view.js');
  IV.mountIssuesView(document.getElementById('issuesView'));
  S.subscribe(() => IV.updateIssuesView());
  if (location.hash.includes('issues')) {
    document.head.insertAdjacentHTML('beforeend', '<style>.wv-sheet-overlay, .wv-sheet { animation: none !important; }</style>');
    const want = location.hash.includes('board') ? 'board' : location.hash.includes('table') ? 'table' : null;
    if (want) setTimeout(() => document.querySelector(`.is-segb[data-view="${want}"]`)?.click(), 700);
    setTimeout(() => { IV.openIssues(); }, 60);
    if (location.hash.includes('sheet')) setTimeout(() => document.querySelector('.is-row[data-id="iss_12"], .is-card[data-id="iss_12"]')?.click(), 900);
    if (location.hash.includes('rich')) window.__ISSUES.issues.find((y) => y.id === 'iss_12').body = '# 결제 실패 재시도\n\n결제 API 가 **5xx** 를 주면 `retry()` 로 세 번까지 다시 시도한다.\n\n- [x] 재현 영상\n- [ ] 원인 찾기\n\n1. 결제 버튼\n2. 서버 오류\n\n> 기대: 자동 재시도\n\n```\nPOST /pay 502\n```\n\n참고 [문서](https://a.io)';
  }
  TV.mountTasksView(document.getElementById('tasksView'));
  AV.mountAutomationsView(document.getElementById('automationsView'));
  await AV.refreshAutoHost(11);
  if (location.hash.includes('tasks')) S.setView('tasks');
  if (location.hash.includes('autos')) AV.openAutomations(location.hash.includes('detail') ? { id: 'a_sched', host: 11 } : {});
  S.state.ws[1] = { layout: { kind: 'terminal', id: 'p1', tabs: [{ win: 1 }, { win: 2 }, { win: 3 }], active: location.hash.includes('focus2') ? 1 : 0 }, focusId: location.hash.includes('focus') ? 'p1' : null, surfaces: [], ports: [3000, 5173] };
  // 행 규격 확인용 — 색 점·고정 핀·포트 텍스트·활성 로컬 행(디자인 리프레시 2026-09-30).
  S.wsPrefs.color[1] = '#60a5fa'; S.wsPrefs.color[2] = '#fb923c'; S.wsPrefs.pinned = [1];
  S.state.activeWsId = 1;
  if (location.hash.includes('collapse')) localStorage.setItem('cpt.sbGroupCollapsed.v1', JSON.stringify({ 2: 1 }));
  else localStorage.removeItem('cpt.sbGroupCollapsed.v1');
  localStorage.removeItem('cpt.activeDeviceId.v1');
  sb.mountSidebar(document.getElementById('sbRoot'));
  sb.updateSidebar();
  S.subscribe(() => { sb.updateSidebar(); TV.updateTasksView(); AV.updateAutomationsView(); });
  TV.updateTasksView(); AV.updateAutomationsView();
  // 한 줄 지시 시트 — `#dispatch` 해시면 문장을 넣고 [계획] 까지 누른다(목 카탈로그 → 목 플랜).
  window.__dispatch = async (text) => {
    const m = await import('./js/dispatch-sheet.js');
    m.openDispatchSheet({ text: text || '코딩피티 백엔드에 결제 실패 재시도 넣고, 매일 아침 9시에 열린 bug 이슈 정리해줘' });
    await new Promise((r) => setTimeout(r, 50));
    [...document.querySelectorAll('.dp-sheet .tk-foot button')].find((b) => b.textContent.trim() === '계획')?.click();
  };
  window.__pcSettings = async (h) => (await import('./js/power-settings.js')).openPcSettingsSheet(h ?? 11);
  if (location.hash.includes('dispopen')) setTimeout(async () => { (await import('./js/dispatch-sheet.js')).openDispatchSheet({ text: '결제 실패 재시도 넣어줘' }); setTimeout(() => { const s = document.querySelector('.dp-sheet select'); const t = [...document.querySelectorAll('.dp-sheet .tk-tile')].find((b) => b.textContent.includes('Claude')); t?.click(); }, 400); }, 100);
  if (location.hash.includes('dispatch') && !location.hash.includes('dispopen')) setTimeout(() => window.__dispatch(), 100);
  if (location.hash.includes('pcset')) setTimeout(() => window.__pcSettings(11), 100);
  if (location.hash.includes('orch')) document.head.insertAdjacentHTML('beforeend', '<style>.wv-sheet-overlay, .wv-sheet { animation: none !important; }</style>');
  if (location.hash.includes('orch')) setTimeout(async () => { (await import('./js/orch-view.js')).openOrchSheet({ host: 11, runId: 'run_a' }); }, 120);
  if (location.hash.includes('fan')) setTimeout(() => document.querySelector('.wsg-fan')?.click(), 50);
  if (location.hash.includes('light')) document.documentElement.dataset.theme = 'light';
  // `#ctx` = 첫 워크스페이스 머리에서 우클릭 메뉴를 연다(메뉴 규격 확인용).
  //  헤드리스 캡처는 등장 모션 중간 프레임을 찍으므로 이 해시에서만 모션을 끈다.
  if (location.hash.includes('ctx')) document.head.insertAdjacentHTML('beforeend', '<style>.ctx-menu { animation: none !important; }</style>');
  if (location.hash.includes('ctx')) setTimeout(() => { const h = document.querySelector('.wsg-head'); const r = h.getBoundingClientRect();
    h.dispatchEvent(new MouseEvent('contextmenu', { bubbles: true, clientX: r.left + 60, clientY: r.top + 20 })); }, 80);
  // 검사용 손잡이 — 지금 보이는 PC 행/워크스페이스 행, 그리고 코드로 PC 전환.
  window.__rows = () => ({
    pcs: [...document.querySelectorAll('.pc-row')].map((r) => r.querySelector('.pc-nm').textContent + (r.classList.contains('picked') || r.classList.contains('active') ? ' ✓' : '')),
    wss: [...document.querySelectorAll('.ws-row .wsr-nm')].map((n) => n.textContent),
    topPlus: !!document.querySelector('.sb-top .ctl-plus, .sb-top [title*="워크스페이스"]'),
    secs: [...document.querySelectorAll('.sb-sec-nm')].map((n) => n.textContent),
  });
  window.__pick = (name) => [...document.querySelectorAll('.pc-row')].find((r) => r.querySelector('.pc-nm').textContent === name)?.click();
</script>
