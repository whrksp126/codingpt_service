<!doctype html>
<!-- 모바일 화면 pane 개발 하네스 — Tauri 없이 실제 데몬 모듈에 붙여 확인한다. -->
<html lang="ko" data-theme="dark">
<head><meta charset="utf-8"><title>emu harness</title><link rel="stylesheet" href="styles.css">
<style>body{margin:0;background:var(--base)} #host{position:fixed;inset:0;display:flex}  /* 혼합 탭(.pane-mixed)과 같은 flex 컨테이너로 둔다 */</style></head>
<body>
<div id="host"></div>
<script type="module">
  window.__TAURI__ = {
    core: {
      invoke: async (cmd, payload) => {
        if (cmd !== 'emulator_local') return {};
        const r = await fetch('/invoke', { method: 'POST', body: JSON.stringify(payload) }).then((x) => x.json());
        if (!r.ok) throw new Error(r.error);
        return r.data;
      },
    },
    event: { listen: async () => () => {} },
  };
  const { EmulatorView } = await import('./js/emulator-view.js');
  window.__v = new EmulatorView(document.getElementById('host'), { deviceId: null, onDeviceChange: () => {} });
  console.log('[harness] WebCodecs:', typeof VideoDecoder === 'function');
</script>
</body></html>
