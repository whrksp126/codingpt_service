<!doctype html>
<!-- 터미널 선택색 실측 하네스(개발 전용) — pane.js 와 **같은 옵션**으로 띄워 눈으로 대조한다.
     실행: cd src && python3 -m http.server 8912  →  http://localhost:8912/term-color-harness.html
     사용: __run({ webgl:true, minContrast:3 })  → 전체 선택 후 스크린샷을 찍어 색을 본다. -->
<html lang="ko" data-theme="dark">
<head><meta charset="utf-8"><title>터미널 색 하네스</title>
<link rel="stylesheet" href="vendor/xterm/xterm.css">
<style>body{margin:0;background:#0A0D14;color:#888;font:12px monospace} #t{width:820px;height:260px} #lab{padding:6px}</style></head>
<body>
<div id="lab">-</div>
<div id="t"></div>
<script src="vendor/xterm/xterm.js"></script>
<script src="vendor/xterm/xterm-addon-fit.js"></script>
<script src="vendor/xterm/xterm-addon-webgl.js"></script>
<script src="vendor/xterm/xterm-addon-canvas.js"></script>
<script type="module">
  window.__TAURI__ = { core: { invoke: async () => ({}) }, event: { listen: async () => () => {} } };
  const { TERM_STYLES, termExtendedAnsi } = await import('./js/theme.js?v=4');
  window.__run = async ({ style = 'auto', mode = 'dark', webgl = true, minContrast = 3, renderer = '', select = true } = {}) => {
    document.getElementById('t').innerHTML = '';
    // pane.js 의 termTheme() 과 동일하게 extendedAnsi(66번 리맵)까지 싣는다 — claude 가 트루컬러
    //  강등으로 칠하는 48;5;66 하이라이트가 선택색으로 보이는지 실측하는 하네스.
    const pal = TERM_STYLES[style][mode];
    const theme = { ...pal, extendedAnsi: termExtendedAnsi(pal) };
    const term = new Terminal({
      cursorBlink: true, fontSize: 14, rows: 10, cols: 74, scrollback: 1000, convertEol: false,
      theme, minimumContrastRatio: minContrast, allowProposedApi: true,
    });
    term.open(document.getElementById('t'));
    if (webgl) { try { term.loadAddon(new WebglAddon.WebglAddon()); } catch (_) { /* noop */ } }
    else if (renderer === 'canvas') { try { term.loadAddon(new CanvasAddon.CanvasAddon()); } catch (_) { /* noop */ } }
    // claude 배너와 비슷하게 — 초록 볼드 + 노랑 경고 + 빈 줄.
    term.write('\x1b[1;32mClaude Code\x1b[0m \x1b[90mv2.1.232\x1b[0m\r\n');
    term.write('  \x1b[36mOpus 5 (1M context)\x1b[0m · Claude Max\r\n');
    term.write('  ~/other/project/tokin\r\n\r\n');
    term.write('\x1b[33m⚠ 1 MCP server needs authentication\x1b[0m · run /mcp\r\n');
    // claude 가 실제로 쓰던 강등 하이라이트(48;5;66) — 리맵되면 이 블록이 선택색(네이비)으로 보인다.
    term.write('\x1b[48;5;66m  claude 드래그 하이라이트(48;5;66) — 리맵 확인  \x1b[0m\r\n');
    await new Promise((r) => setTimeout(r, 200));
    if (select) term.selectAll();
    term.focus();
    document.getElementById('lab').textContent =
      `${style}/${mode} · webgl=${webgl} · minContrast=${minContrast} · theme.selection=${theme.selectionBackground} · theme.cursor=${theme.cursor}`;
    await new Promise((r) => setTimeout(r, 250));
    return 'ok';
  };
  await window.__run({});
</script>
</body>
</html>
