<!doctype html><html data-theme="dark"><head><meta charset="utf-8">
<link rel="stylesheet" href="/styles.css">
<style>html,body{margin:0;height:100%;background:#0d1117}#host{padding:20px;max-width:760px}</style>
</head><body><div id="host"></div>
<script>
let installed = [
  { key:'acme.deploy-helper', name:'배포 도우미', version:'1.2.0', enabled:true,
    contributes:{ quickCommands:[1], commands:[], skills:[1], languagePacks:[1] } },
  { key:'acme.gone', name:'사라진 것', version:'0.1.0', enabled:false, missing:true, contributes:null },
];
window.__TAURI__ = { event:{listen:async()=>(()=>{}) }, core: { invoke: async (cmd, p) => {
  const c = p && p.cmd;
  if (c === 'plugins.list') return { plugins: installed, capabilities: {} };
  if (c === 'plugins.marketplace') return { name:'CodingPT 공식 플러그인', plugins: [
    { id:'acme.deploy-helper', description:'배포 명령 묶음', source:{url:'https://github.com/acme/deploy.git', ref:'main'} },
    { id:'acme.i18n-extra', description:'번역 추가 팩', source:{url:'https://github.com/acme/i18n.git', ref:'v1'} },
  ]};
  if (c === 'plugins.preview') return { manifest:{ key:'acme.i18n-extra', name:'번역 추가 팩', version:'1.0.0',
      description:'일본어·중국어 문구를 더합니다', capabilities:['language-packs'] },
    commit:'a'.repeat(40), consent:'deadbeefcafe0001',
    permissions:[{kind:'language-packs',label:'화면 문구 번역을 추가해요'}] };
  if (c === 'plugins.install') { window.__installed = p.args; installed = installed.concat([{key:'acme.i18n-extra',name:'번역 추가 팩',version:'1.0.0',enabled:true,contributes:{languagePacks:[1],quickCommands:[],commands:[],skills:[]}}]); return {ok:true}; }
  if (c === 'plugins.setEnabled') { installed = installed.map(x=>x.key===p.args.key?{...x,enabled:p.args.enabled}:x); return {ok:true}; }
  if (c === 'plugins.uninstall') { installed = installed.filter(x=>x.key!==p.args.key); return {ok:true}; }
  return {};
}}};
import('/js/plugins-view.js').then(m => { m.renderPlugins(document.getElementById('host')); window.__ready=1; })
  .catch(e => { window.__err = String(e); });
</script></body></html>
