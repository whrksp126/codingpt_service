<!doctype html>
<html lang="ko" data-theme="dark">
<head><meta charset="utf-8"><title>desk harness</title>
<link rel="stylesheet" href="vendor/xterm/xterm.css"><link rel="stylesheet" href="styles.css">
<style>body{margin:0;background:var(--base)} #host{position:fixed;inset:0;display:flex}</style>
<script src="vendor/xterm/xterm.js"></script><script src="vendor/xterm/xterm-addon-fit.js"></script><script src="vendor/xterm/xterm-addon-search.js"></script><script src="vendor/xterm/xterm-addon-webgl.js"></script><script src="vendor/xterm/xterm-addon-canvas.js"></script>
</head>
<body><div id="host"></div>
<script type="module">
  window.__TAURI__ = { core: { invoke: async (cmd, payload) => {
      if (cmd !== 'emulator_local') return {};
      const r = await fetch('/invoke', { method: 'POST', body: JSON.stringify(payload) }).then((x) => x.json());
      if (!r.ok) throw new Error(r.error); return r.data; } }, event: { listen: async () => () => {} } };
  const { EmulatorView } = await import('./js/emulator-view.js');
  window.__v = new EmulatorView(document.getElementById('host'), { deviceId: new URLSearchParams(location.search).get('dev') || null, onDeviceChange: () => {} });
  window.__sheet = () => import('./js/desktop-sheet.js').then((m) => m.openDesktopSheet());
</script></body></html>
