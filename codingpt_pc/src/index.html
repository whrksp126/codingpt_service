<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodingPT</title>
    <link rel="stylesheet" href="vendor/xterm/xterm.css" />
    <link rel="stylesheet" href="vendor/codemirror/codemirror.css" />
    <link rel="stylesheet" href="vendor/codemirror/theme/material-darker.css" />
    <link rel="stylesheet" href="vendor/codemirror/addon/hint/show-hint.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shell">
      <aside id="sidebar"></aside>
      <main class="main">
        <section id="wsView" class="ws-view"></section>
        <section id="settingsView"></section>
      </main>
    </div>

    <!-- 미로그인 게이트(로그인 전 앱 사용 차단) — 최상위 오버레이. -->
    <div id="loginGate"></div>

    <!-- 벤더(전역): xterm. 모듈보다 먼저 실행돼 window.Terminal/FitAddon 노출. -->
    <script src="vendor/xterm/xterm.js"></script>
    <script src="vendor/xterm/xterm-addon-fit.js"></script>
    <script src="vendor/xterm/xterm-addon-search.js"></script>
    <!-- CodeMirror(내장 IDE 에디터) — core → modes → addons. window.CodeMirror 전역. -->
    <script src="vendor/codemirror/codemirror.js"></script>
    <script src="vendor/codemirror/mode/xml/xml.js"></script>
    <script src="vendor/codemirror/mode/javascript/javascript.js"></script>
    <script src="vendor/codemirror/mode/css/css.js"></script>
    <script src="vendor/codemirror/mode/htmlmixed/htmlmixed.js"></script>
    <script src="vendor/codemirror/mode/jsx/jsx.js"></script>
    <script src="vendor/codemirror/mode/markdown/markdown.js"></script>
    <script src="vendor/codemirror/mode/python/python.js"></script>
    <script src="vendor/codemirror/mode/clike/clike.js"></script>
    <script src="vendor/codemirror/mode/shell/shell.js"></script>
    <script src="vendor/codemirror/mode/diff/diff.js"></script>
    <script src="vendor/codemirror/addon/edit/closebrackets.js"></script>
    <script src="vendor/codemirror/addon/edit/matchbrackets.js"></script>
    <script src="vendor/codemirror/addon/comment/comment.js"></script>
    <script src="vendor/codemirror/addon/selection/active-line.js"></script>
    <!-- 자동완성(show-hint) — core 뒤, 각 언어 힌트. -->
    <script src="vendor/codemirror/addon/hint/show-hint.js"></script>
    <script src="vendor/codemirror/addon/hint/anyword-hint.js"></script>
    <script src="vendor/codemirror/addon/hint/javascript-hint.js"></script>
    <script src="vendor/codemirror/addon/hint/xml-hint.js"></script>
    <script src="vendor/codemirror/addon/hint/html-hint.js"></script>
    <script src="vendor/codemirror/addon/hint/css-hint.js"></script>
    <script src="vendor/codemirror/addon/search/searchcursor.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
