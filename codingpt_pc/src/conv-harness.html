<!doctype html>
<!-- 채팅 v2 도구줄 확인용 하네스(개발 전용) — cd src && python3 -m http.server 8899 → /conv-harness.html#model|mode|effort|usage|plus|more -->
<html lang="ko" data-theme="dark"><head><meta charset="utf-8"><title>conv 하네스</title>
<link rel="stylesheet" href="styles.css">
<style>body{margin:0;height:100vh;display:flex}#host{flex:1;display:flex;min-width:0;height:100vh}#host>.pane-conv{display:flex;flex:1;flex-direction:column;height:100vh}</style></head>
<body><div id="host" class="pane-conv"></div>
<script type="module">
  const CAPS = { enabled: true, modes: ['default','acceptEdits','plan','auto','bypassPermissions'], agents: [
    { id: 'claude', label: 'Claude', available: true, defaultModel: 'sonnet', defaultEffort: null,
      efforts: ['low','medium','high','xhigh','max'],
      models: [{id:'opus',label:'Opus'},{id:'sonnet',label:'Sonnet'},{id:'haiku',label:'Haiku'},{id:'fable',label:'Fable'},
        {id:'claude-fable-5-1',label:'Fable 5.1'},{id:'claude-opus-5-5',label:'Opus 5.5'},{id:'claude-opus-4-8',label:'Opus 4.8'},{id:'claude-opus-4-7',label:'Opus 4.7'},
        {id:'claude-sonnet-5-5',label:'Sonnet 5.5'},{id:'claude-sonnet-4-6',label:'Sonnet 4.6'},{id:'claude-haiku-4-5',label:'Haiku 4.5'}] }] };
  window.__TAURI__ = { core: { invoke: async (cmd, args) => {
    if (cmd === 'stt_start') return 7;   // 음성 입력 — __L['cpt-stt']({payload:{id:7,t:'ready'|'text'|'level'|'end'}}) 로 흉내 낸다
    if (cmd === 'back_api_async' && args.path === '/api/daemon/conv') { if (args.body.method === 'conv.caps') return { success: true, data: CAPS }; return { success: true, data: {} }; }
    return {};
  } }, event: { listen: async (name, cb) => { (window.__L ||= {})[name] = cb; return () => { delete window.__L[name]; }; } }, dialog: { open: async () => null } };
  const { ConvView } = await import('./js/conv-view.js');
  const host = document.getElementById('host');
  const v = new ConvView(host, { tab: () => ({}), patchTab() {}, cwd: () => 'x', isLocal: () => true, openTerminal() {}, fs: () => null,
    rpc: async (method) => (method === 'conv.caps' ? CAPS : {}) });
  v.mount(); v.setVisible(true); window.__v = v;
  await new Promise((r) => setTimeout(r, 300));
  v._caps = CAPS; v.m.threadId = 't1'; v._opened = true; v._stopTick?.();
  v.m.thread = { id: 't1', agent: 'claude', model: 'claude-sonnet-4-6', mode: 'acceptEdits', effort: 'medium', usage: { model: 'claude-sonnet-4-6', contextTokens: 58000, contextMax: 200000,
    rateLimit: { kind: 'five_hour', utilization: 0.73, resetsAt: Math.floor(Date.now() / 1000) + 11000, blocked: false } } };
  v._mode = 'acceptEdits'; v._usageKey = '';
  v._syncHead(); v._syncUsage();
  const h = location.hash.slice(1);
  setTimeout(() => {
    if (h === 'model') v._toggleModelMenu();
    if (h === 'more-models') { v._toggleModelMenu(); setTimeout(() => v._pickEl?.querySelector('[data-id=more]')?.click(), 50); }
    if (h === 'mode') v._toggleModeMenu();
    if (h === 'effort') v._toggleEffortPop();
    if (h === 'usage') v._toggleUsagePop();
    if (h === 'plus') v.composer._togglePlusMenu();
    if (h === 'more') v._toggleMoreMenu();
  }, 100);
</script></body></html>
