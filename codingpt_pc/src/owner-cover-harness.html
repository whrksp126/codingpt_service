<!doctype html>
<!-- "이 기기에 맞추기" 가림막(owner-cover.js) 확인용 하네스(개발 전용) — 앱과 같은 모듈·같은 styles.css 를 쓴다.
     실행: cd src && python3 -m http.server 8901  →  http://localhost:8901/owner-cover-harness.html
     `#light` = 라이트 테마. 좌: 가림막(cover) · 우상: 그대로 보기(peek) · 우하: 낮은 pane 의 가림막. -->
<html lang="ko" data-theme="dark">
<head><meta charset="utf-8"><title>크기 맞추기 하네스</title>
<link rel="stylesheet" href="vendor/xterm/xterm.css"><link rel="stylesheet" href="styles.css">
<style>
  html, body { margin: 0; height: 100%; background: var(--base); }
  .grid { height: 100vh; display: grid; grid-template-columns: 1.3fr 1fr; grid-template-rows: 1fr 150px; gap: 1px; background: var(--border); }
  .grid .pane { background: var(--base); } .grid .pane:first-child { grid-row: 1 / 3; }
</style></head>
<body>
<div class="grid" id="grid"></div>
<script src="vendor/xterm/xterm.js"></script>
<script type="module">
  const LIGHT = location.hash.includes('light');
  try { localStorage.setItem('cpt.theme', LIGHT ? 'light' : 'dark'); } catch (_) {}
  if (LIGHT) document.documentElement.dataset.theme = 'light';
  window.__TAURI__ = { core: { invoke: async () => ({}) }, event: { listen: async () => () => {} } };
  const { createOwnerCover } = await import('./js/owner-cover.js');
  const { termTheme, monoFontStack } = await import('./js/theme.js');
  const LINES = [
    '\x1b[90m~/other/project/codingpt\x1b[0m \x1b[32mmain\x1b[0m',
    '$ npm test', '', '> codingpt-pc@0.1.389 test', '> node test/bundle-sidecar.mjs && node test/parse-esm.mjs', '',
    'PASS 사이드카 번들 스크립트가 rm -f 뒤 cp 를 쓴다', 'PASS ESM 구문 — src/js/pane.js', 'PASS ESM 구문 — src/js/owner-cover.js',
    '\x1b[31mFAIL\x1b[0m 예시 실패 줄  (expected 3, got 2)', '', '모두 통과: 41 / 실패: 1', '$ git status --short', ' M src/js/pane.js', ' M src/styles.css', '$ ',
  ];
  window.__covers = [];
  const mk = (name, phase) => {
    const pane = document.createElement('div'); pane.className = 'pane';
    const body = document.createElement('div'); body.className = 'pane-body';
    const termEl = document.createElement('div'); termEl.className = 'pane-term scaled';
    termEl.style.background = termTheme().background || '';
    body.appendChild(termEl); pane.appendChild(body); document.getElementById('grid').appendChild(pane);
    const term = new Terminal({ cols: 48, rows: 16, fontSize: 9, fontFamily: monoFontStack(), theme: termTheme() });
    term.open(termEl); term.write(LINES.join('\r\n'));
    const log = [];
    const cover = createOwnerCover({ guardEl: termEl, settleMs: 0, onClaim: () => { log.push('claim'); cover.setOwner({ viewer: false, name: '' }); term.focus(); }, onPeek: () => log.push('peek') });
    body.appendChild(cover.el);
    cover.setContext({ key: 1, visible: true });
    cover.setOwner({ viewer: true, name });
    if (phase === 'peek') setTimeout(() => cover.el.querySelector('.op-peek').click(), 30);
    window.__covers.push({ cover, log, term, termEl });
  };
  mk('Galaxy S24', 'cover'); mk('iPad Pro', 'peek'); mk('', 'cover');
  // `#selftest` = 동작 자가 점검(결과는 #result 에 JSON). 포커스 가로채기 · Esc=그대로 보기 · 모서리 버튼=맞추기 ·
  //  등장 지연(잠깐 뒤집힌 판정은 안 보인다) · 탭이 바뀌면 새 판정이 올 때까지 숨는다.
  if (location.hash.includes('selftest')) {
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    const r = {};
    await sleep(100);
    const a = window.__covers[0];
    a.term.focus();
    r.focusGuard = document.activeElement === a.cover.el.querySelector('.op-btn');
    a.cover.el.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
    r.escPeek = a.cover.phase() === 'peek' && a.log.join() === 'peek';
    a.term.focus();
    r.peekLetsType = a.termEl.contains(document.activeElement);
    a.cover.el.querySelector('.op-mini').click();
    r.miniClaims = a.log.join() === 'peek,claim' && a.cover.phase() === 'hidden';
    const c = window.__covers[2];
    c.cover.el.click();
    r.coverClickClaims = c.log.join() === 'claim' && c.cover.phase() === 'hidden';
    const d = createOwnerCover({ settleMs: 200, onClaim() {} });
    document.body.appendChild(d.el);
    d.setContext({ key: 1, visible: true });
    d.setOwner({ viewer: true, name: 'x' });
    r.notImmediate = d.phase() === 'hidden';
    await sleep(60); d.setOwner({ viewer: false, name: '' });      // 한두 틱 뒤 뒤집힘 → 한 번도 안 뜬다
    await sleep(300); r.flipNeverShows = d.phase() === 'hidden';
    d.setOwner({ viewer: true, name: 'x' }); await sleep(300);
    r.settledShows = d.phase() === 'cover';
    d.setContext({ key: 2, visible: true });                          // 탭 전환 — 판정 미확정
    r.tabSwitchHidesNow = d.phase() === 'hidden';
    await sleep(350); r.unconfirmedStaysHidden = d.phase() === 'hidden';
    d.setOwner({ viewer: true, name: 'y' }); await sleep(300);
    r.confirmedShows = d.phase() === 'cover';
    d.setContext({ key: 2, visible: false });                         // 채팅 모드·IDE 탭
    r.invisibleHides = d.phase() === 'hidden';
    d.dispose();
    const pre = document.createElement('pre'); pre.id = 'result'; pre.textContent = JSON.stringify(r); document.body.appendChild(pre);
  }
  setTimeout(() => { document.body.dataset.ready = '1'; }, 400);
</script>
</body></html>
