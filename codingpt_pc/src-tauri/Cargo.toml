[package]
name = "codingpt_pc"
version = "0.1.81"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "codingpt_pc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 바이너리/프로세스 이름 = CodingPT — macOS 메뉴바가 프로세스명을 표시하므로(특히 dev 실행)
#  tauri.conf mainBinaryName 과 함께 맞춘다. 표기만 바뀌고 패키지명(codingpt_pc)은 유지.
[[bin]]
name = "CodingPT"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "unstable", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
portable-pty = "0.8"
base64 = "0.22"
ureq = { version = "2", features = ["json"] }
tauri-plugin-updater = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }


[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString"] }
block2 = "0.6"
objc2-user-notifications = { version = "0.3", features = ["block2", "UNNotificationSettings", "UNUserNotificationCenter"] }
