# stg-codingpt-back.ghmate.com   → codingpt_back_stg:5100
# stg-codingpt-front.ghmate.com  → codingpt_front_stg:3400  (Next.js 공개 랜딩/결제/웹코딩)
# (어드민은 독립 프로젝트로 분리됨 → ../codingpt_admin)
# dev 구조(docker-compose.dev.yml) 미러 — DB는 홈서버 Docker PostgreSQL (RDS 미사용)

services:
  postgres:
    container_name: codingpt_postgres_stg
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: codingpt_db
      POSTGRES_USER: codingpt
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
    volumes:
      - postgres_stg_data:/var/lib/postgresql/data
    networks:
      - codingpt_stg
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codingpt -d codingpt_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  back:
    container_name: codingpt_back_stg
    build:
      context: ./codingpt_back
      dockerfile: Dockerfile.stg
    expose:
      - "5100"
    environment:
      - NODE_ENV=staging
      - CODE_EXECUTOR_URL=http://code-executor:5200
      - DB_HOST=postgres
      - DB_SSL=false
    env_file:
      - ./codingpt_back/.env.stg
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - codingpt_stg
      - nginx_proxy
    restart: unless-stopped

  # 공개 사이트(Next.js SSR)
  front:
    container_name: codingpt_front_stg
    build:
      context: ./codingpt_front
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: https://stg-codingpt-back.ghmate.com
        NEXT_PUBLIC_SUBSCRIPTION_SALES_ENABLED: ${SUBSCRIPTION_SALES_ENABLED:-false}
        NEXT_PUBLIC_PORTONE_STORE_ID: ${PORTONE_STORE_ID:-}
        NEXT_PUBLIC_PORTONE_CHANNEL_KEY_CHARGE: ${PORTONE_CHANNEL_KEY_CHARGE:-}
        NEXT_PUBLIC_PORTONE_CHANNEL_KEY_BILLING: ${PORTONE_CHANNEL_KEY_BILLING:-}
    environment:
      - NODE_ENV=production
      - BACKEND_INTERNAL_URL=http://back:5100
    expose:
      - "3400"
    networks:
      - codingpt_stg
      - nginx_proxy
    restart: unless-stopped

  # 어드민(Vite)은 독립 프로젝트로 분리됨 → ../codingpt_admin (자체 docker-compose)

  code-executor:
    container_name: codingpt_code_executor_stg
    build:
      context: ./codingpt_back
      dockerfile: Dockerfile.stg
    command: node executor-server.js
    expose:
      - "5200"
    environment:
      - NODE_ENV=staging
      - SKIP_MIGRATIONS=1
    env_file:
      - ./codingpt_back/.env.stg
    networks:
      - codingpt_stg
    restart: unless-stopped

networks:
  codingpt_stg:
    driver: bridge
  nginx_proxy:
    external: true

volumes:
  postgres_stg_data:
