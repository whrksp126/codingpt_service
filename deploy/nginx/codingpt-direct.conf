# codingpt-direct.ghmate.com — Cloudflare 우회 직결(터미널 WS 저지연 전용). Let's Encrypt 인증서.
# ⚠️ 추가 전용 파일: 기존 vhost/서비스와 무관. 제거하려면 이 파일 삭제 + `nginx -s reload`.
# 업스트림/WS 헤더/타임아웃은 codingpt-back.ghmate.com(프로덕션) 블록과 동일, 인증서만 LE 로 교체.
server {
    listen 80;
    listen 443 ssl;
    server_name codingpt-direct.ghmate.com;

    ssl_certificate     /etc/nginx/certs/codingpt-direct.fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/codingpt-direct.key;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $up_cpt_direct codingpt_back_prod;
        proxy_pass http://$up_cpt_direct:5100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_connect_timeout 300;
    }
}
