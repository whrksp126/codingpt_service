# codingpt 공용 nginx_proxy vhost — 원본은 이 파일(codingpt_service/deploy/nginx/). deploy.sh 가 서버 conf.d 로 동기화한다.
# 서버에서 직접 고치지 말 것: 다음 배포 때 이 파일로 덮어써진다.
#
# 구조: 사용자 → Cloudflare DNS(⚪ 직통 또는 🟠 경유) → nginx_proxy(443) → 컨테이너
# 인증서: 공용 *.ghmate.com Let's Encrypt(snippets/ghmate-ssl.inc, 서버 cron 자동 갱신) — 🟠 경유에서도 그대로 통한다.
# 헤더: snippets/ghmate-proxy-headers.inc 가 X-Real-IP / X-Forwarded-For / CF-Connecting-IP 를 실제 접속 IP($remote_addr,
#       00-ghmate-common.conf realip) 로 덮어쓴다 → 앱이 CF-Connecting-IP 를 읽어도 직통에서 위조 불가.
# 업스트림은 변수 + resolver 127.0.0.11 — 컨테이너가 죽어 있어도 nginx -t 가 통과해 다른 프로젝트 reload 를 막지 않는다.
# 롤백: /srv/nginx-proxy/bin/cf-dns.sh proxy <fqdn>

# ─── http → https ───
server {
    listen 80;
    server_name codingpt-back.ghmate.com codingpt-front.ghmate.com codingpt.ghmate.com;
    return 301 https://$host$request_uri;
}

# dev 환경(dev-codingpt-back/front)은 2026-11-26 정리(컨테이너·vhost·DNS 제거, DB 볼륨·덤프는 서버에 보존).
#  다시 쓰려면 ./deploy.sh dev 전에 아래 prod 블록을 복제해 server_name·업스트림(codingpt_back_dev:5100,
#  codingpt_front_dev:3400)만 바꿔 넣고, DNS 레코드를 다시 만든다.

# ─── prod back (앱·PC·데몬 API + WS 릴레이) ───
server {
    listen 443 ssl;
    server_name codingpt-back.ghmate.com;
    include /etc/nginx/conf.d/snippets/ghmate-ssl.inc;
    resolver 127.0.0.11 valid=10s ipv6=off;
    # 업로드 상한 — 앱 express.json(10mb) 와 맞춘다(첨부는 384KB 조각 업로드).
    client_max_body_size 10m;

    location / {
        limit_req  zone=ghmate_req burst=200 nodelay;
        limit_conn ghmate_conn 100;
        set $up_back_prod codingpt_back_prod;
        proxy_pass http://$up_back_prod:5100;
        include /etc/nginx/conf.d/snippets/ghmate-proxy-headers.inc;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
        proxy_connect_timeout 300;
    }
    # 데몬 릴레이(제어·dial-back 스트림·터미널·포트 포워딩 WS)와 프리뷰 프록시는 한 IP 에서 동시 연결·요청이
    #  몰린다(포워딩은 TCP 1개당 WS 1개, Vite 프리뷰는 모듈 수백 개 동시 요청) → 연결 제한 제외, 요청 버스트 넉넉히.
    location ~ ^/api/(daemon|preview|terminal)/ {
        limit_req  zone=ghmate_req burst=2000 nodelay;
        set $up_back_prod codingpt_back_prod;
        proxy_pass http://$up_back_prod:5100;
        include /etc/nginx/conf.d/snippets/ghmate-proxy-headers.inc;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
        proxy_connect_timeout 300;
    }
}

# ─── prod front ───
server {
    listen 443 ssl;
    server_name codingpt-front.ghmate.com;
    include /etc/nginx/conf.d/snippets/ghmate-ssl.inc;
    resolver 127.0.0.11 valid=10s ipv6=off;
    limit_req  zone=ghmate_req burst=200 nodelay;
    limit_conn ghmate_conn 100;

    location / {
        set $up_front_prod codingpt_front_prod;
        proxy_pass http://$up_front_prod:3400;
        include /etc/nginx/conf.d/snippets/ghmate-proxy-headers.inc;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }
}

# ─── 정식 공개 도메인 — Next.js 공개 웹(랜딩+구독결제+약관+웹 바이브코딩) ───
server {
    listen 443 ssl;
    server_name codingpt.ghmate.com;
    include /etc/nginx/conf.d/snippets/ghmate-ssl.inc;
    resolver 127.0.0.11 valid=10s ipv6=off;
    limit_req  zone=ghmate_req burst=200 nodelay;
    limit_conn ghmate_conn 100;

    location / {
        set $up_front_pub codingpt_front_prod;
        proxy_pass http://$up_front_pub:3400;
        include /etc/nginx/conf.d/snippets/ghmate-proxy-headers.inc;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }
}
