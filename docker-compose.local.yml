services:
  postgres:
    container_name: codingpt_postgres_local
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: codingpt_db
      POSTGRES_USER: codingpt
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
    ports:
      - "5432:5432"
    volumes:
      - codingpt_back_postgres_local_data:/var/lib/postgresql/data
    networks:
      - codingpt_local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codingpt -d codingpt_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  back:
    container_name: codingpt_back_local
    build:
      context: ./codingpt_back
      dockerfile: Dockerfile.local
    ports:
      - "5300:5300"
    environment:
      - DB_HOST=postgres
      - AGENT_WORKER_URL=http://agent-worker:5400
      # M5 Slice4: 클라우드 러너 컨테이너 기동(cloudRunnerService). 기동 컨테이너를 back 과 같은
      #  네트워크에 붙여 RUNNER_SERVER_URL(http://back:5300)로 아웃바운드 연결되게 한다.
      - CLOUD_RUNNER_NETWORK=codingpt_service_codingpt_local
      - CLOUD_RUNNER_IMAGE=codingpt-runner:dev
    env_file:
      - ./codingpt_back/.env.local
    volumes:
      - ./codingpt_back:/app
      - /app/node_modules
      # M5 Slice4: 클라우드 러너 컨테이너 기동용 docker.sock(로컬/dev). prod 는 별도 결정(agent-worker 경유 or 스코프드).
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - codingpt_local
    restart: unless-stopped

  # 샌드박스/프리뷰 워커 — 사용자 dev 서버·터미널·PTY 를 back 프로세스 밖 격리 컨테이너에서 구동.
  # (과거 클라우드 AI SDK query() 실행부는 BYO 피벗으로 제거됨.) 내부 전용(ports 매핑 금지). replica=1 유지.
  agent-worker:
    container_name: codingpt_agent_worker_local
    build:
      context: ./codingpt_back
      dockerfile: Dockerfile.local
    command: ["node", "agent-worker.js"]
    expose:
      - "5400"
    environment:
      - SKIP_MIGRATIONS=1
      - AGENT_WORKER_PORT=5400
      - AGENT_WORKSPACE_ROOT=/workspace
      # Phase 2: 사용자별 샌드박스 컨테이너 격리 설정
      - AGENT_SANDBOX_ENABLED=1
      - AGENT_SANDBOX_IMAGE=codingpt_service-agent-worker
      - AGENT_SANDBOX_VOLUME=codingpt_service_cpt_agent_workspace
      # dev 서버(vite/esbuild) 메모리 여유 — 512MB 면 OOM Killed.
      - AGENT_SANDBOX_MEM_MB=2048
      # 샌드박스는 internal 네트워크(직접 인터넷 차단) + allowlist 프록시로만 egress
      - AGENT_SANDBOX_NETWORK=cpt_sandbox_net_local
      - AGENT_EGRESS_PROXY=http://egress-proxy:3128
    env_file:
      - ./codingpt_back/.env.local
    volumes:
      - ./codingpt_back:/app
      - /app/node_modules
      - cpt_agent_workspace:/workspace
      # Phase 2: 사용자별 샌드박스 컨테이너 spawn 용(워커에만 노출, back 엔 없음)
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - codingpt_local
      - cpt_sandbox_net       # 미리보기 dev 서버 프록시: 샌드박스 컨테이너에 직접 HTTP 도달
    restart: unless-stopped

  # 샌드박스 egress allowlist 프록시 — internal 네트워크의 샌드박스가 이걸 통해서만 인터넷.
  egress-proxy:
    container_name: codingpt_egress_proxy_local
    image: ubuntu/squid:latest
    volumes:
      - ./egress-proxy/squid.conf:/etc/squid/squid.conf:ro
    networks:
      - codingpt_local       # 인터넷 egress
      - cpt_sandbox_net       # 샌드박스(internal)와 통신
    restart: unless-stopped

  # 공개 사이트(Next.js SSR) — 랜딩 + 구독/크레딧 결제 + 약관
  front:
    container_name: codingpt_front_local
    build:
      context: ./codingpt_front
      dockerfile: Dockerfile.dev
    ports:
      - "3400:3400"
    environment:
      - NODE_ENV=development
      - BACKEND_INTERNAL_URL=http://back:5300
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:5300
      - NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID=${GOOGLE_WEB_CLIENT_ID:-}
      - NEXT_PUBLIC_PORTONE_STORE_ID=${PORTONE_STORE_ID:-}
      - NEXT_PUBLIC_PORTONE_CHANNEL_KEY_BILLING=${PORTONE_CHANNEL_KEY_BILLING:-}
    volumes:
      - ./codingpt_front:/app
      - /app/node_modules
      - /app/.next
    networks:
      - codingpt_local
    restart: unless-stopped

  # 어드민(Vite)은 독립 프로젝트로 분리됨 → ../codingpt_admin (자체 docker-compose)

networks:
  codingpt_local:
    driver: bridge
  # 샌드박스 전용 internal 네트워크 — 직접 인터넷 차단(egress-proxy 통해서만 나감)
  cpt_sandbox_net:
    name: cpt_sandbox_net_local
    internal: true

volumes:
  codingpt_back_postgres_local_data:
    external: true
  cpt_agent_workspace:
