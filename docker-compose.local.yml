services:
  postgres:
    container_name: codingpt_postgres_local
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: codingpt_db
      POSTGRES_USER: codingpt
      POSTGRES_PASSWORD: codingpt123
    ports:
      - "5432:5432"
    volumes:
      - codingpt_back_postgres_local_data:/var/lib/postgresql/data
    networks:
      - codingpt_local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codingpt -d codingpt_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  back:
    container_name: codingpt_back_local
    build:
      context: ./codingpt_back
      dockerfile: Dockerfile.local
    ports:
      - "5300:5300"
    environment:
      - DB_HOST=postgres
      - AGENT_WORKER_URL=http://agent-worker:5400
    env_file:
      - ./codingpt_back/.env.local
    volumes:
      - ./codingpt_back:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - codingpt_local
    restart: unless-stopped

  # 바이브코딩 에이전트 워커 — Agent SDK query() 를 back 프로세스 밖에서 실행(M3-full Phase 1).
  # back 은 /api/agent/* 를 이 워커로 프록시. 내부 전용(ports 매핑 금지). replica=1 유지(승인 대기 메모리).
  agent-worker:
    container_name: codingpt_agent_worker_local
    build:
      context: ./codingpt_back
      dockerfile: Dockerfile.local
    command: ["node", "agent-worker.js"]
    expose:
      - "5400"
    environment:
      - SKIP_MIGRATIONS=1
      - AGENT_WORKER_PORT=5400
      - AGENT_WORKSPACE_ROOT=/workspace
      # Phase 2: 사용자별 샌드박스 컨테이너 격리 설정
      - AGENT_SANDBOX_ENABLED=1
      - AGENT_SANDBOX_IMAGE=codingpt_service-agent-worker
      - AGENT_SANDBOX_VOLUME=codingpt_service_cpt_agent_workspace
      # 샌드박스는 internal 네트워크(직접 인터넷 차단) + allowlist 프록시로만 egress
      - AGENT_SANDBOX_NETWORK=cpt_sandbox_net_local
      - AGENT_EGRESS_PROXY=http://egress-proxy:3128
    env_file:
      - ./codingpt_back/.env.local
    volumes:
      - ./codingpt_back:/app
      - /app/node_modules
      - cpt_agent_workspace:/workspace
      # Phase 2: 사용자별 샌드박스 컨테이너 spawn 용(워커에만 노출, back 엔 없음)
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - codingpt_local
    restart: unless-stopped

  # 샌드박스 egress allowlist 프록시 — internal 네트워크의 샌드박스가 이걸 통해서만 인터넷.
  egress-proxy:
    container_name: codingpt_egress_proxy_local
    image: ubuntu/squid:latest
    volumes:
      - ./egress-proxy/squid.conf:/etc/squid/squid.conf:ro
    networks:
      - codingpt_local       # 인터넷 egress
      - cpt_sandbox_net       # 샌드박스(internal)와 통신
    restart: unless-stopped

  front:
    container_name: codingpt_front_local
    build:
      context: ./codingpt_front
      dockerfile: Dockerfile.local
    ports:
      - "3300:3100"
    env_file:
      - ./codingpt_front/.env.local
    volumes:
      - ./codingpt_front:/app
      - /app/node_modules
    networks:
      - codingpt_local
    restart: unless-stopped

networks:
  codingpt_local:
    driver: bridge
  # 샌드박스 전용 internal 네트워크 — 직접 인터넷 차단(egress-proxy 통해서만 나감)
  cpt_sandbox_net:
    name: cpt_sandbox_net_local
    internal: true

volumes:
  codingpt_back_postgres_local_data:
    external: true
  cpt_agent_workspace:
