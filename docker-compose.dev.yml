# dev-codingpt-back.ghmate.com   → codingpt_back_dev:5100
# dev-codingpt-front.ghmate.com  → codingpt_front_dev:3400  (Next.js 공개 랜딩/결제/웹코딩)
# (어드민은 독립 프로젝트로 분리됨 → ../codingpt_admin)

services:
  postgres:
    container_name: codingpt_postgres_dev
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: codingpt_db
      POSTGRES_USER: codingpt
      POSTGRES_PASSWORD: codingpt123
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - codingpt_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codingpt -d codingpt_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  back:
    container_name: codingpt_back_dev
    build:
      context: ./codingpt_back
      dockerfile: Dockerfile.dev
    expose:
      - "5100"
    environment:
      - NODE_ENV=development
      - CODE_EXECUTOR_URL=http://code-executor:5200
      - AGENT_WORKER_URL=http://agent-worker:5400
      - DB_HOST=postgres
    env_file:
      - ./codingpt_back/.env.dev
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - codingpt_dev
      - nginx_proxy
    restart: unless-stopped

  # 공개 사이트(Next.js SSR)
  front:
    container_name: codingpt_front_dev
    build:
      context: ./codingpt_front
      dockerfile: Dockerfile.dev
    environment:
      - NODE_ENV=development
      - BACKEND_INTERNAL_URL=http://back:5100
      - NEXT_PUBLIC_BACKEND_URL=https://dev-codingpt-back.ghmate.com
      - NEXT_PUBLIC_PORTONE_STORE_ID=${PORTONE_STORE_ID:-}
      - NEXT_PUBLIC_PORTONE_CHANNEL_KEY_CHARGE=${PORTONE_CHANNEL_KEY_CHARGE:-}
      - NEXT_PUBLIC_PORTONE_CHANNEL_KEY_BILLING=${PORTONE_CHANNEL_KEY_BILLING:-}
    expose:
      - "3400"
    networks:
      - codingpt_dev
      - nginx_proxy
    restart: unless-stopped

  # 어드민(Vite)은 독립 프로젝트로 분리됨 → ../codingpt_admin (자체 docker-compose)

  code-executor:
    container_name: codingpt_code_executor_dev
    build:
      context: ./codingpt_back
      dockerfile: Dockerfile.dev
    command: node executor-server.js
    expose:
      - "5200"
    environment:
      - SKIP_MIGRATIONS=1
    env_file:
      - ./codingpt_back/.env.dev
    networks:
      - codingpt_dev
    restart: unless-stopped

  # 샌드박스/프리뷰 워커 — 사용자 dev 서버·터미널·PTY 격리 실행(docker.sock). (클라우드 AI query() 실행부는 제거됨.)
  # 내부 전용(nginx_proxy 미연결). replica=1 유지. 이미지 이름 명시(샌드박스가 재사용).
  agent-worker:
    container_name: codingpt_agent_worker_dev
    build:
      context: ./codingpt_back
      dockerfile: Dockerfile.dev
    image: codingpt-agent-worker:dev
    command: node agent-worker.js
    expose:
      - "5400"
    environment:
      - NODE_ENV=development
      - SKIP_MIGRATIONS=1
      - AGENT_WORKER_PORT=5400
      - AGENT_WORKSPACE_ROOT=/workspace
      - AGENT_SANDBOX_ENABLED=1
      - AGENT_SANDBOX_IMAGE=codingpt-agent-worker:dev
      - AGENT_SANDBOX_MEM_MB=2048   # dev 서버(vite) 메모리 여유(512MB OOM 방지)
      - AGENT_SANDBOX_VOLUME=cpt_agent_workspace_dev
      # 샌드박스는 internal 네트워크(직접 인터넷 차단) + allowlist 프록시로만 egress
      - AGENT_SANDBOX_NETWORK=cpt_sandbox_net_dev
      - AGENT_EGRESS_PROXY=http://egress-proxy:3128
    env_file:
      - ./codingpt_back/.env.dev
    volumes:
      - cpt_agent_workspace:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - codingpt_dev
      - cpt_sandbox_net       # 미리보기 dev 서버 프록시: 샌드박스에 직접 HTTP 도달
    restart: unless-stopped

  # 샌드박스 egress allowlist 프록시 — internal 네트워크 샌드박스가 이걸 통해서만 인터넷.
  egress-proxy:
    container_name: codingpt_egress_proxy_dev
    image: ubuntu/squid:latest
    volumes:
      - ./egress-proxy/squid.conf:/etc/squid/squid.conf:ro
    networks:
      - codingpt_dev      # 인터넷 egress
      - cpt_sandbox_net     # 샌드박스(internal)와 통신
    restart: unless-stopped

networks:
  codingpt_dev:
    driver: bridge
  nginx_proxy:
    external: true
  cpt_sandbox_net:
    name: cpt_sandbox_net_dev
    internal: true

volumes:
  postgres_dev_data:
  cpt_agent_workspace:
    name: cpt_agent_workspace_dev
