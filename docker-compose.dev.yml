# dev-codingpt-back.ghmate.com  → codingpt_back_dev:5100
# dev-codingpt-front.ghmate.com → codingpt_front_dev:3100

services:
  postgres:
    container_name: codingpt_postgres_dev
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: codingpt_db
      POSTGRES_USER: codingpt
      POSTGRES_PASSWORD: codingpt123
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - codingpt_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codingpt -d codingpt_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  back:
    container_name: codingpt_back_dev
    build:
      context: ./codingpt_back
      dockerfile: Dockerfile.dev
    expose:
      - "5100"
    environment:
      - NODE_ENV=development
      - CODE_EXECUTOR_URL=http://code-executor:5200
      - AGENT_WORKER_URL=http://agent-worker:5400
      - DB_HOST=postgres
    env_file:
      - ./codingpt_back/.env.dev
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - codingpt_dev
      - nginx_proxy
    restart: unless-stopped

  front:
    container_name: codingpt_front_dev
    build:
      context: ./codingpt_front
      dockerfile: Dockerfile.dev
    expose:
      - "3300"
    env_file:
      - ./codingpt_front/.env.dev
    networks:
      - codingpt_dev
      - nginx_proxy
    restart: unless-stopped

  code-executor:
    container_name: codingpt_code_executor_dev
    build:
      context: ./codingpt_back
      dockerfile: Dockerfile.dev
    command: node executor-server.js
    expose:
      - "5200"
    environment:
      - SKIP_MIGRATIONS=1
    env_file:
      - ./codingpt_back/.env.dev
    networks:
      - codingpt_dev
    restart: unless-stopped

  # 바이브코딩 에이전트 워커 — query() 실행 + 사용자별 샌드박스 컨테이너(docker.sock).
  # 내부 전용(nginx_proxy 미연결). replica=1 유지. 이미지 이름 명시(샌드박스가 재사용).
  agent-worker:
    container_name: codingpt_agent_worker_dev
    build:
      context: ./codingpt_back
      dockerfile: Dockerfile.dev
    image: codingpt-agent-worker:dev
    command: node agent-worker.js
    expose:
      - "5400"
    environment:
      - NODE_ENV=development
      - SKIP_MIGRATIONS=1
      - AGENT_WORKER_PORT=5400
      - AGENT_WORKSPACE_ROOT=/workspace
      - AGENT_SANDBOX_ENABLED=1
      - AGENT_SANDBOX_IMAGE=codingpt-agent-worker:dev
      - AGENT_SANDBOX_VOLUME=cpt_agent_workspace_dev
      - AGENT_SANDBOX_NETWORK=bridge
    env_file:
      - ./codingpt_back/.env.dev
    volumes:
      - cpt_agent_workspace:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - codingpt_dev
    restart: unless-stopped

networks:
  codingpt_dev:
    driver: bridge
  nginx_proxy:
    external: true

volumes:
  postgres_dev_data:
  cpt_agent_workspace:
    name: cpt_agent_workspace_dev
