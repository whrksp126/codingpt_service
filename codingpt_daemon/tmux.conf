# CodingPT 데몬 터미널용 tmux 설정 (전용 소켓 -L codingpt).
# 서버 시작 시점(-f)에 로드돼야 클라이언트 attach 전에 alt-screen override 가 적용된다.
# IDE 샌드박스 tmux.conf 와 동일 — 모바일 xterm 에서 정상 동작하는 조건.

set -g status off                       # 하단 상태바 숨김(모바일 화면 절약)

# 스크롤: tmux 출력이 xterm 자체 스크롤백에 쌓이게 해 모바일 터치 스크롤을 xterm 네이티브로 처리.
#  · smcup@/rmcup@: 대체화면(alt-screen) 비활성 → 출력이 메인 버퍼에 남음
#  · indn@: 여러 줄 스크롤(indn) capability 비활성. tmux 3.4+ 는 화면 하단 넘침 시 개행이 아니라
#    \x1b[S(SU, scroll-up region)로 스크롤하는데, xterm.js 는 SU 로 밀려난 줄을 스크롤백에 저장하지
#    않는다(개행만 저장). indn@ 로 무효화하면 tmux 가 개행 폴백을 써서 xterm 스크롤백에 쌓인다.
#  · mouse off: 터치를 마우스로 tmux 에 넘기지 않음(네이티브 스크롤 유지, copy-mode 누수 방지).
set -g mouse off
# ⚠ alternate-screen 을 off 로 두지 말 것(2026-09-04 회귀). off 면 tmux 자신이 alternate 상태를
#   추적하지 않아 #{alternate_on} 이 less/vim 안에서도 0 이다 → 스크롤 라우팅이 풀스크린 앱을
#   일반 셸로 오판한다. 위 smcup@:rmcup@ 가 이미 "클라이언트로 1049 를 안 보낸다"를 보장하므로
#   기기별 scrollback 오염 없이 tmux 가 화면 복원까지 해 준다.
setw -g alternate-screen on

# ⚠ scroll-on-clear off — `clear` 가 과거를 **정말** 지우게 하는 유일한 스위치(2026-09-04 실측).
#   TERM=xterm-256color 의 `clear` 는 E3(`\e[3J`, 스크롤백 삭제) → `\e[H\e[2J` 순으로 내보낸다.
#   tmux 는 3J 로 history 를 0 으로 만든 **직후** ED2 를 만나 scroll-on-clear=on 규칙대로 방금 지운
#   화면을 history 로 도로 밀어 넣는다. 실측: clear 전 42줄 → on 이면 23줄 / off 면 0줄.
#   그래서 어느 기기에서 clear 를 해도 위로 스크롤하면 지운 프롬프트가 남아 있었다.
setw -g scroll-on-clear off
set -ga terminal-overrides ',*:smcup@:rmcup@:indn@'

# 터미널 이름 = tmux 자동 개명(cmux/Ghostty 탭과 같은 UX).
#  window name 이 전 기기 공유 원천이라 자동 개명이 곧 전 기기 탭 이름 동기화다.
#  우선순위: 셸 대기 중=폴더명 → 앱이 쏜 OSC 타이틀(pane_title — claude 는 "✳ …" 상태까지 세팅)
#  → 프로세스명 폴백. 셸 자신이 쏘는 "user@host:path" 타이틀은 앱 타이틀로 오인하지 않게 걸러낸다
#  (claude 설치 바이너리는 프로세스명이 버전번호 "2.1.211" 라 pane_current_command 만으론 무의미).
#  수동 이름(cpt rename-terminal 등 rename-window)은 tmux 가 그 window 의 automatic-rename 을
#  꺼서 자연히 우선된다. 이스케이프 개명(allow-rename)은 계속 차단 — window name 직접 개명만 방지
#  (pane_title 은 allow-rename 과 무관하게 갱신됨).
setw -g automatic-rename on
setw -g automatic-rename-format '#{?#{||:#{==:#{pane_current_command},zsh},#{||:#{==:#{pane_current_command},bash},#{||:#{==:#{pane_current_command},sh},#{||:#{==:#{pane_current_command},fish},#{||:#{==:#{pane_current_command},-zsh},#{||:#{==:#{pane_current_command},-bash},#{==:#{pane_current_command},login}}}}}}},#{b:pane_current_path},#{?#{&&:#{!=:#{pane_title},},#{&&:#{!=:#{pane_title},#{host}},#{&&:#{!=:#{pane_title},#{host_short}},#{?#{m:*@#{host_short}*,#{pane_title}},0,1}}}},#{pane_title},#{pane_current_command}}}'
set -g allow-rename off

set -g history-limit 10000
set -g escape-time 0
set -g default-terminal "xterm-256color"

# 트루컬러 관통 — attach 클라이언트(우리 xterm.js, TERM=xterm-256color)는 RGB SGR 을 그대로
#  렌더할 수 있는데, 이걸 광고하지 않으면 tmux 가 24bit 색을 256색으로 강등해 내보낸다.
#  실측(2026-08-15): claude 의 드래그 선택색 #264F78(네이비)가 강등을 거치며 48;5;66(#5F8787
#  세이지)로 뭉개져 "초록 선택" 오인 신고의 진범이었다. (COLORTERM=truecolor 주입은 poolEnvMap.)
#  terminal-features(3.2+)가 정본, terminal-overrides Tc 는 구버전 폴백.
set -as terminal-features ',xterm-256color:RGB'
set -ga terminal-overrides ',xterm-256color:Tc'
setw -g aggressive-resize on
set -g window-size latest
set -g focus-events off

# OSC 알림 passthrough — 프로그램이 \ePtmux;..\e\\ 로 래핑한 시퀀스(OSC 777/9 알림 등)를
#  클라이언트(xterm)까지 통과시킨다. cpt claude-hook 이 주 알림 소스지만 OSC 보조 경로도 열어둔다.
set -g allow-passthrough on
