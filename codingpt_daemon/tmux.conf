# CodingPT 데몬 터미널용 tmux 설정 (전용 소켓 -L codingpt).
# 서버 시작 시점(-f)에 로드돼야 클라이언트 attach 전에 alt-screen override 가 적용된다.
# IDE 샌드박스 tmux.conf 와 동일 — 모바일 xterm 에서 정상 동작하는 조건.

set -g status off                       # 하단 상태바 숨김(모바일 화면 절약)

# 스크롤: tmux 출력이 xterm 자체 스크롤백에 쌓이게 해 모바일 터치 스크롤을 xterm 네이티브로 처리.
#  · smcup@/rmcup@: 대체화면(alt-screen) 비활성 → 출력이 메인 버퍼에 남음
#  · indn@: 여러 줄 스크롤(indn) capability 비활성. tmux 3.4+ 는 화면 하단 넘침 시 개행이 아니라
#    \x1b[S(SU, scroll-up region)로 스크롤하는데, xterm.js 는 SU 로 밀려난 줄을 스크롤백에 저장하지
#    않는다(개행만 저장). indn@ 로 무효화하면 tmux 가 개행 폴백을 써서 xterm 스크롤백에 쌓인다.
#  · mouse off: 터치를 마우스로 tmux 에 넘기지 않음(네이티브 스크롤 유지, copy-mode 누수 방지).
set -g mouse off
set -ga terminal-overrides ',*:smcup@:rmcup@:indn@'

# 터미널 이름("터미널 N")은 풀 window name 에 저장돼 전 기기 공유 — 실행 명령/이스케이프로
#  자동 개명되면 이름이 흔들리므로 차단.
setw -g automatic-rename off
set -g allow-rename off

set -g history-limit 10000
set -g escape-time 0
set -g default-terminal "xterm-256color"
setw -g aggressive-resize on
set -g window-size latest
set -g focus-events off
