version: '3.8'

services:
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "3100:3100"
    environment:
      - NODE_ENV=production
      - CODE_EXECUTOR_URL=http://code-executor:5200
    env_file:
      - .env
    depends_on:
      - code-executor
    restart: always

  code-executor:
    build:
      context: .
      dockerfile: Dockerfile.executor
    ports:
      - "5200:5200"
    environment:
      - PORT=5200
    env_file:
      - .env
    networks:
      - default
    restart: always 