# CodingPT 모바일 IDE 터미널용 tmux 설정 (사용자 샌드박스 컨테이너에서 사용)
# Docker exec attach 가 유휴 ~80초에 끊겨도 tmux 세션(셸/실행중 프로세스)은 유지 → 재접속 시 복귀.
set -g status off                       # 상태바 숨김(한 줄 절약, 모바일 화면 협소)

# ── 스크롤: 대체화면(alt-screen) 비활성 → tmux 출력이 xterm 자체 스크롤백에 쌓인다.
#   그러면 모바일 터치 스크롤이 xterm 네이티브 스크롤로 동작(copy-mode·마우스휠 주입 불필요).
#   mouse on 이면 xterm 이 터치를 마우스로 tmux 에 넘겨 네이티브 스크롤이 깨지고 copy-mode([0/0])·
#   경계 누수($$$) 가 생기므로 mouse off.
set -g mouse off
set -ga terminal-overrides ',*:smcup@:rmcup@'

set -g history-limit 10000
set -g escape-time 0
set -g default-terminal "xterm-256color"
setw -g aggressive-resize on
set -g focus-events off
