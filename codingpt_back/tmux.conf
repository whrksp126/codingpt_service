# CodingPT 모바일 IDE 터미널용 tmux 설정 (사용자 샌드박스 컨테이너에서 사용)
# Docker exec attach 가 유휴 ~80초에 끊겨도 tmux 세션(셸/실행중 프로세스)은 유지 → 재접속 시 복귀.
set -g status off                       # 상태바 숨김(한 줄 절약, 모바일 화면 협소)

# ── 스크롤: 대체화면(alt-screen) 비활성 → tmux 출력이 xterm 자체 스크롤백에 쌓인다.
#   그러면 모바일 터치 스크롤이 xterm 네이티브 스크롤로 동작(copy-mode·마우스휠 주입 불필요).
#   mouse on 이면 xterm 이 터치를 마우스로 tmux 에 넘겨 네이티브 스크롤이 깨지고 copy-mode([0/0])·
#   경계 누수($$$) 가 생기므로 mouse off.
set -g mouse off
# ⚠ alternate-screen 을 off 로 두지 말 것(2026-09-04 회귀). off 면 tmux 자신이 alternate 상태를
#   추적하지 않아 #{alternate_on} 이 less/vim 안에서도 0 이다 → 스크롤 라우팅이 풀스크린 앱을
#   일반 셸로 오판한다. 위 smcup@:rmcup@ 가 이미 "클라이언트로 1049 를 안 보낸다"를 보장하므로
#   기기별 scrollback 오염 없이 tmux 가 화면 복원까지 해 준다.
setw -g alternate-screen on

# ⚠ scroll-on-clear off — `clear` 가 과거를 **정말** 지우게 하는 유일한 스위치(2026-09-04 실측).
#   TERM=xterm-256color 의 `clear` 는 E3(`\e[3J`, 스크롤백 삭제) → `\e[H\e[2J` 순으로 내보낸다.
#   tmux 는 3J 로 history 를 0 으로 만든 **직후** ED2 를 만나 scroll-on-clear=on 규칙대로 방금 지운
#   화면을 history 로 도로 밀어 넣는다. 실측: clear 전 42줄 → on 이면 23줄 / off 면 0줄.
#   그래서 어느 기기에서 clear 를 해도 위로 스크롤하면 지운 프롬프트가 남아 있었다.
setw -g scroll-on-clear off
set -ga terminal-overrides ',*:smcup@:rmcup@'

set -g history-limit 10000
set -g escape-time 0
set -g default-terminal "xterm-256color"
setw -g aggressive-resize on
set -g focus-events off
