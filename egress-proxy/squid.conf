# 샌드박스 egress allowlist 프록시 (M3-full 보안 강화)
# 사용자 샌드박스는 직접 인터넷이 막혀 있고(internal 네트워크), 이 프록시를 통해서만 나간다.
# 아래 allowlist 도메인만 허용(패키지 레지스트리 등) — 그 외 egress 는 전부 차단.

http_port 3128

# --- 허용 도메인(패키지 레지스트리/런타임 다운로드) ---
# 필요 도메인 추가 시 이 목록 수정 후 프록시 재시작.
# .domain 형식은 apex(domain) + 모든 서브도메인을 포함(exact 와 중복 금지).
acl allowed_dst dstdomain .npmjs.org .yarnpkg.com
acl allowed_dst dstdomain .pypi.org .pythonhosted.org
acl allowed_dst dstdomain .github.com .githubusercontent.com
acl allowed_dst dstdomain .nodejs.org .jsdelivr.net .unpkg.com
acl allowed_dst dstdomain .crates.io .rubygems.org
acl allowed_dst dstdomain .golang.org .maven.org
acl allowed_dst dstdomain repo.maven.apache.org

# HTTPS(CONNECT)는 표준 포트만
acl SSL_ports port 443
acl CONNECT method CONNECT
acl Safe_ports port 80 443

# CONNECT 는 안전 포트 + 허용 도메인만
http_access deny CONNECT !SSL_ports
http_access allow CONNECT allowed_dst
http_access allow allowed_dst
# 그 외 전부 차단
http_access deny all

# 캐시 비활성(보안 단순화). 로그는 squid 기본 파일(/var/log/squid/)로 — proxy 유저 권한 문제 회피.
cache deny all
# 프록시 식별 헤더 최소화
via off
forwarded_for delete
httpd_suppress_version_string on
dns_v4_first on
